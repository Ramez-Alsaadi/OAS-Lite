            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="header">
            <div>
                <h1  data-er="إدارة الحضور" data-en="Attendance Management">إدارة الحضور</h1>
                <p id="pageDescription" data-er="تسجيل حضور وانصراف الموظفين" data-en="Recording employee attendance and departure">تسجيل حضور وانصراف الموظفين</p>

            <div class="form-group">
                <label for="employee" data-ar="اختر الموضف" data-en="Select Employee">اختر الموظف</label>

                
<div class="form-group">
    <label for="employee" data-ar="اختر الموضف" data-en="Select Employee">اختر الموظف</label>

    <select id="employee" name="employeeId" required>

        <option value="" data-ar="اختر الموضف" data-en="Select Employee">اختر الموظف</option>

        <option th:each="employee : ${employees}"
                th:value="${employee.id}"
                th:text="${employee.fullName}">
        </option>

    </select>
</div>


            </div>

            <div class="buttons">
                <button class="check-in" type="button" data-ar="تسجيل حضور" data-en="Check In">

                </button>

                    تسجيل الانصراف
                </button>
            </div>

            <div id="status" class="status"></div>
        </section>

        <section class="card" data-ar="تعليمات النظام" data-en="System Instructions">تعليمات النظام
            <h2>تعليمات النظام</h2>

            <div class="note">
                <p  data-ar="وقت الحضور الرسمي 06:00 صباحآ" data-en="Official Check-In Time: 06:00 AM">وقت الحضور الرسمي: 06:00 صباحًا</p>
                <p data-ar="وقت الانصراف الرسمي 05:00 مساء" data-en="Official Check-Out Time: 05:00 PM>وقت الانصراف الرسمي: 05:00 مساء"ً</p>
                <p data-ar="سيتم ربط هذه الصفحة بقاعدة بيانات الموظفين وواجهة تسجيل الحضور والانصراف في الخطوة التالية"
                   data-en="This page will be connected to the employee database and attendance API in the next step.">
                    سيتم ربط هذه الصفحة بقاعدة بيانات الموظفين
                    وواجهة تسجيل الحضور والانصراف في الخطوة التالية.
                </p>
            </div>
        </section>

    </main>

    
  
<script>
    let currentLanguage = "ar";

    function toggleLanguage() {

        currentLanguage =
            currentLanguage === "ar" ? "en" : "ar";

        document.documentElement.lang = currentLanguage;

        document.documentElement.dir =
            currentLanguage === "ar" ? "rtl" : "ltr";

        document.querySelectorAll("[data-ar][data-en]")
            .forEach(function(element) {

                element.textContent =
                    element.getAttribute(
                        "data-" + currentLanguage
                    );

            });

        document.getElementById("languageButton")
            .textContent =
                currentLanguage === "ar"
                    ? "English"
                    : "العربية";
    }
</script>




<script>
    // ==============================
    // OAS Lite - Attendance Actions
    // ==============================

    const employeeSelect = document.getElementById("employee");

    const checkInButton = document.querySelector(".check-in");

    const checkOutButton = document.querySelector(".check-out");


    // تسجيل الحضور
    checkInButton.addEventListener("click", async function () {

        const employeeId = employeeSelect.value;

        if (!employeeId) {
            alert("يرجى اختيار الموظف أولاً");
            return;
        }

        checkInButton.disabled = true;

        try {

            const response = await fetch(
                `/api/attendance/check-in/${employeeId}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {

                if (response.status === 409) {
                    alert("الموظف مسجل حضوره بالفعل اليوم");
                } else {
                    alert("فشل تسجيل الحضور");
                }

                return;
            }

            alert("تم تسجيل الحضور بنجاح");

            location.reload();

        } catch (error) {

            console.error("Check-in error:", error);

            alert("تعذر الاتصال بالخادم");

        } finally {

            checkInButton.disabled = false;

        }

    });


    // تسجيل الانصراف
    checkOutButton.addEventListener("click", async function () {

        const employeeId = employeeSelect.value;

        if (!employeeId) {
            alert("يرجى اختيار الموظف أولاً");
            return;
        }

        checkOutButton.disabled = true;

        try {

            // جلب سجلات الحضور
            const response = await fetch("/api/attendance");

            if (!response.ok) {
                alert("تعذر جلب سجلات الحضور");
                return;
            }

            const attendanceRecords = await response.json();

            // البحث عن سجل الموظف الذي لم يسجل انصرافه
            const attendance = attendanceRecords.find(record => {

                const recordEmployeeId = record.employee?.id;

                const checkoutTime = record.checkOut ?? record.checkout;

                return String(recordEmployeeId) === String(employeeId)
                    && !checkoutTime;

            });

            if (!attendance) {

                alert("لا يوجد سجل حضور مفتوح لهذا الموظف");

                return;

            }

            // تسجيل الانصراف
            const checkoutResponse = await fetch(
                `/api/attendance/check-out/${attendance.id}`,
                {
                    method: "POST"
                }
            );

            if (!checkoutResponse.ok) {

                alert("فشل تسجيل الانصراف");

                return;

            }

            alert("تم تسجيل الانصراف بنجاح");

            location.reload();

        } catch (error) {

            console.error("Check-out error:", error);

            alert("تعذر الاتصال بالخادم");

        } finally {

            checkOutButton.disabled = false;

        }

    });

</script>
